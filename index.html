<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>호준 브롤</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&family=Lilita+One&display=swap">
<style>
/* Layout: 무대는 밤의 학교 체육관. 남색 벽 판넬 + 단풍나무 마루 위에 두꺼운 잉크 테두리 스티커 UI, 게임은 마루 위 탑뷰 아레나 */
:root{
  color-scheme: dark;
  --wall:#1b2558;
  --wall-2:#222f6e;
  --panel:#2a3a8f;
  --panel-2:#34479f;
  --ink:#10122b;
  --yolk:#ffd23f;
  --yolk-dk:#d9a000;
  --sky:#59b8ff;
  --sky-dk:#2f86d6;
  --mint:#3fe08e;
  --rose:#ff4f6d;
  --violet:#a07cff;
  --maple:#e3ad70;
  --maple-2:#d99f62;
  --paper:#fffaf0;
  --text:#ffffff;
  --muted:#c3cbf5;
  --f-disp:"Black Han Sans","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-num:"Lilita One","Black Han Sans","Noto Sans KR","Apple SD Gothic Neo",sans-serif;
  --f-ui:"Jua","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --ol:0 3px 0 var(--ink),2px 2px 0 var(--ink),-2px 2px 0 var(--ink),2px -2px 0 var(--ink),-2px -2px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink);
  --planks:repeating-linear-gradient(90deg,var(--maple) 0 46px,#c98f55 46px 48px,#e7b47a 48px 94px,#c98f55 94px 96px,var(--maple-2) 96px 142px,#c98f55 142px 144px);
}
*{box-sizing:border-box}
html{height:100%;box-sizing:border-box;background:var(--wall)}
body{height:100%;margin:0;background:var(--wall);color:var(--text);font-family:var(--f-ui);font-size:15px;line-height:1.4;overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--yolk);outline-offset:3px}
svg{display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#app{position:relative;height:100%;overflow:hidden;background:var(--wall)}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;min-height:0}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:.01em}

/* 버튼 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-family:var(--f-disp);font-size:1.08rem;line-height:1;color:var(--ink);background:var(--yolk);border:3px solid var(--ink);border-radius:14px;padding:12px 18px;box-shadow:0 5px 0 var(--ink),inset 0 -5px 0 var(--yolk-dk),inset 0 3px 0 rgba(255,255,255,.55);transition:transform .07s,box-shadow .07s;white-space:nowrap}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--ink),inset 0 -3px 0 var(--yolk-dk),inset 0 3px 0 rgba(255,255,255,.55)}
.btn.blue{background:var(--sky);box-shadow:0 5px 0 var(--ink),inset 0 -5px 0 var(--sky-dk),inset 0 3px 0 rgba(255,255,255,.5)}
.btn.blue:active:not(:disabled){box-shadow:0 1px 0 var(--ink),inset 0 -3px 0 var(--sky-dk)}
.btn.ghost{background:var(--panel-2);color:var(--text);box-shadow:0 5px 0 var(--ink),inset 0 -5px 0 rgba(16,18,43,.25),inset 0 3px 0 rgba(255,255,255,.18)}
.btn.ghost:active:not(:disabled){box-shadow:0 1px 0 var(--ink),inset 0 -3px 0 rgba(16,18,43,.25)}
.btn.small{font-size:.92rem;padding:8px 12px;border-radius:11px;box-shadow:0 4px 0 var(--ink),inset 0 -4px 0 var(--yolk-dk),inset 0 2px 0 rgba(255,255,255,.55)}
.btn.small.blue{box-shadow:0 4px 0 var(--ink),inset 0 -4px 0 var(--sky-dk),inset 0 2px 0 rgba(255,255,255,.5)}
.btn.small.ghost{box-shadow:0 4px 0 var(--ink),inset 0 -4px 0 rgba(16,18,43,.25)}
.btn.big{font-size:1.3rem;padding:15px 22px;border-radius:18px}
.btn:disabled{filter:grayscale(.7) brightness(.75)}
.btn.poor{filter:saturate(.35) brightness(.85)}
.btn.armed{background:var(--rose);color:#fff;box-shadow:0 4px 0 var(--ink),inset 0 -4px 0 #c93350}
.shake{animation:shake .35s}

.coin{display:inline-block;flex:none;width:1.05em;height:1.05em;border-radius:50%;border:2px solid var(--ink);background:radial-gradient(circle at 35% 30%,#fff6b8 0 18%,var(--yolk) 46%,var(--yolk-dk));vertical-align:-.16em}
.chip{display:inline-flex;align-items:center;gap:7px;background:rgba(16,18,43,.55);border:2px solid var(--ink);border-radius:999px;padding:6px 12px;font-size:1rem;min-width:0}

/* 공 캐릭터 */
.ball{--ring:var(--sky);position:relative;display:inline-block;flex:none;border-radius:50%;background:var(--ring);border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink)}
.ball img{position:absolute;inset:3px;width:calc(100% - 6px);height:calc(100% - 6px);border-radius:50%;object-fit:cover;pointer-events:none;-webkit-user-drag:none}
.ball.s{width:36px;height:36px;border-width:2px;box-shadow:0 2px 0 var(--ink)}
.ball.s img{inset:2px;width:calc(100% - 4px);height:calc(100% - 4px)}
.ball.m{width:54px;height:54px}
.ball.l{width:74px;height:74px}

/* 시작 화면 */
#s-title{overflow-y:auto;padding-inline:16px;padding-block:20px;background:radial-gradient(ellipse 80% 50% at 50% 0%,rgba(89,184,255,.25),transparent 70%),repeating-linear-gradient(90deg,var(--wall) 0 70px,var(--wall-2) 70px 73px)}
.title-in{margin-block:auto;width:100%;display:grid;justify-items:center;gap:18px}
.logo{margin:0;font-family:var(--f-disp);font-weight:400;line-height:.88;text-align:center;transform:rotate(-5deg)}
.logo span{display:block;text-shadow:0 7px 0 var(--ink),3px 3px 0 var(--ink),-3px 3px 0 var(--ink),3px -3px 0 var(--ink),-3px -3px 0 var(--ink),3px 0 0 var(--ink),-3px 0 0 var(--ink),0 -3px 0 var(--ink),0 3px 0 var(--ink)}
.logo .a{font-size:clamp(2.6rem,14vw,4.6rem);color:var(--yolk)}
.logo .b{font-size:clamp(3.4rem,20vw,6.2rem);color:#fff;margin-top:.04em}
.roster{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:320px}
.roster>span{display:block;animation:hop 1.8s ease-in-out infinite;animation-delay:calc(var(--i) * .16s)}
.card{background:var(--panel);border:3px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink)}
.auth{width:min(100%,360px);padding:18px}
.authf{display:grid;gap:12px;text-align:center}
.authf h2{margin:0;font-family:var(--f-disp);font-weight:400;font-size:1.5rem;text-shadow:var(--ol)}
.field{display:grid;gap:6px;text-align:left}
.field label{font-size:.9rem;color:var(--muted)}
.field input{width:100%;font-family:var(--f-ui);font-size:1.2rem;padding:11px 14px;border-radius:12px;border:3px solid var(--ink);background:var(--paper);color:var(--ink);box-shadow:inset 0 3px 0 rgba(16,18,43,.12)}
.msg{margin:0;min-height:1.3em;font-size:.88rem;color:var(--muted)}
.msg.err{color:#ffc2cc}
.msg b{color:var(--text);font-weight:400}
.field label small{margin-left:4px;font-size:.78rem;opacity:.8}
.field input[type=password]{letter-spacing:.08em}
.linkbtn{justify-self:center;background:none;border:0;padding:6px 10px;font-size:.92rem;color:var(--muted)}
.linkbtn b{font-weight:400;color:var(--text);text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:2px}
.linkbtn:disabled{opacity:.6}
.acc-id{margin:0;font-size:.88rem;color:var(--muted)}
.pf{display:grid;gap:10px;padding:12px;border-radius:14px;background:rgba(16,18,43,.38);border:2px solid var(--ink);text-align:left}
.pf h3{margin:0;font-family:var(--f-disp);font-weight:400;font-size:1.1rem}
.pf .msg{min-height:0}
.pf-pic{display:flex;align-items:center;gap:14px}
.pf-btns{display:flex;flex-wrap:wrap;gap:8px}
.pf-btns label.btn{cursor:pointer}
.field.row{display:flex;gap:8px;align-items:center}
.field.row input{flex:1;min-width:0;width:auto}
.field input{font-size:1.1rem}
.acc-id b{font-weight:400;color:var(--text)}
.gift{margin:0;font-size:.9rem;color:var(--yolk)}
.loading{margin:8px 0;text-align:center;color:var(--muted)}
.who{display:flex;align-items:center;justify-content:center;gap:12px;text-align:left}
.who b{display:block;font-family:var(--f-disp);font-weight:400;font-size:1.35rem}
.who small{color:var(--muted)}
.savenote{margin:0;max-width:34ch;text-align:center;font-size:.85rem;color:var(--muted)}

/* 로비 */
#s-lobby{background:radial-gradient(ellipse 55% 38% at 50% 42%,rgba(255,210,63,.18),transparent 72%),repeating-linear-gradient(90deg,var(--wall) 0 72px,var(--wall-2) 72px 75px)}
.topbar{position:relative;z-index:3;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-inline:16px;padding-block:10px}
.me{display:flex;align-items:center;gap:9px;min-width:0;background:rgba(16,18,43,.55);border:2px solid var(--ink);border-radius:999px;padding:3px 14px 3px 3px;text-align:left}
.me-t{display:grid;min-width:0;line-height:1.15}
.me-t b{font-family:var(--f-disp);font-weight:400;font-size:1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me-s{display:flex;align-items:center;gap:4px;color:var(--yolk);font-size:.9rem}
.tro svg{width:15px;height:15px}
.tb-r{display:flex;align-items:center;gap:8px}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;border:2px solid var(--ink);background:rgba(16,18,43,.55)}
.icon-btn svg{width:22px;height:22px}
.stage{position:relative;flex:1;min-height:0;display:grid;place-items:center}
.floor{position:absolute;left:0;right:0;bottom:0;height:42%;background:var(--planks);border-top:4px solid var(--ink)}
.floor::after{content:"";position:absolute;left:50%;top:14%;width:min(76%,460px);height:52%;transform:translateX(-50%);border:5px solid rgba(255,255,255,.8);border-radius:50%}
.side{position:absolute;top:14px;z-index:2;display:grid;gap:12px}
.side.l{left:16px}.side.r{right:16px}
.sbtn{position:relative;width:70px;display:grid;justify-items:center;gap:3px;padding:9px 4px 7px;background:var(--panel-2);border:3px solid var(--ink);border-radius:16px;box-shadow:0 5px 0 var(--ink);font-family:var(--f-disp);font-size:.9rem;text-shadow:0 2px 0 var(--ink);transition:transform .07s,box-shadow .07s}
.sbtn svg{width:32px;height:32px}
.sbtn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.dot{position:absolute;top:-7px;right:-7px;width:18px;height:18px;border-radius:50%;background:var(--rose);border:3px solid var(--ink)}
.hero{position:relative;z-index:1;display:grid;justify-items:center;gap:6px;padding-inline:96px;text-align:center}
.hero-ball{width:clamp(108px,30vmin,200px);height:clamp(108px,30vmin,200px);border-width:5px;box-shadow:0 7px 0 var(--ink);animation:bob 2.4s ease-in-out infinite}
.hero-ball img{inset:5px;width:calc(100% - 10px);height:calc(100% - 10px)}
.hero-shadow{width:clamp(70px,20vmin,130px);height:14px;border-radius:50%;background:rgba(16,18,43,.38);margin-top:2px}
.hero-name{font-family:var(--f-disp);font-weight:400;font-size:clamp(1.35rem,5.4vw,1.9rem);line-height:1.1;text-shadow:var(--ol);text-wrap:balance}
.hero-meta{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 10px;font-size:.85rem;color:var(--ink);background:rgba(255,250,240,.85);border:2px solid var(--ink);border-radius:12px;padding:4px 10px;max-width:30ch}
.hero-meta b{font-weight:400}
.playbar{position:relative;z-index:2;display:grid;justify-items:center;gap:6px;padding-inline:16px;padding-block:6px 14px;background:var(--planks)}
.play{width:min(100%,360px);font-size:1.5rem;padding:17px 22px}
.mode-note{margin:0;text-align:center;font-size:.8rem;color:var(--ink);max-width:40ch}

/* 패널(장비/상점/랭킹/채팅) */
.panel{background:repeating-linear-gradient(90deg,var(--wall) 0 72px,var(--wall-2) 72px 75px)}
.phead{position:relative;z-index:2;display:flex;align-items:center;gap:12px;padding-inline:16px;padding-block:10px;background:var(--panel);border-bottom:3px solid var(--ink);box-shadow:0 4px 0 rgba(16,18,43,.4)}
.phead h2{margin:0;flex:1;min-width:0;font-family:var(--f-disp);font-weight:400;font-size:1.45rem;text-shadow:var(--ol)}
.back{flex:none;width:44px;height:44px;display:grid;place-items:center;border-radius:12px;border:3px solid var(--ink);background:var(--yolk);box-shadow:0 4px 0 var(--ink)}
.back svg{width:22px;height:22px}
.back:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.pbody{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-inline:16px;padding-block:16px 30px}
.pin{max-width:760px;margin:0 auto;display:grid;gap:22px}
.sec h3{margin:0 0 4px;font-family:var(--f-disp);font-weight:400;font-size:1.2rem;color:var(--yolk);text-shadow:var(--ol)}
.sub{margin:0 0 10px;color:var(--muted);font-size:.86rem}
.sub.center,.center{text-align:center}
.sub.small{font-size:.8rem;margin:0}
.grid{display:grid;gap:12px}
.cgrid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.pgrid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.ccard,.pcard{position:relative;display:grid;justify-items:center;align-content:start;gap:4px;padding:14px 10px 12px;text-align:center;transition:transform .07s}
.ccard:active,.pcard:active{transform:translateY(3px)}
.ccard .cn,.pcard b{font-family:var(--f-disp);font-weight:400;font-size:1.05rem;margin-top:4px}
.ccard .cs,.ccard .cu{font-size:.82rem;color:var(--muted)}
.ccard .cu{color:#d8c9ff}
.ccard .cd,.pcard small{font-size:.8rem;color:var(--muted);text-wrap:balance}
.lockic{position:absolute;top:10px;right:10px}
.lockic svg{width:24px;height:24px}
.locked .ball{filter:grayscale(.85) brightness(.75)}
.tag{display:inline-flex;align-items:center;gap:5px;margin-top:6px;padding:4px 10px;border-radius:999px;background:rgba(16,18,43,.5);border:2px solid var(--ink);font-size:.82rem}
.tag.on{background:var(--yolk);color:var(--ink)}
.sel{border-color:var(--yolk);box-shadow:0 5px 0 var(--ink),0 0 0 3px var(--yolk)}
.pi svg{width:42px;height:42px}
.ilist{display:grid;gap:12px}
.icard{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-areas:"ic im" "ic ia";column-gap:12px;row-gap:8px;align-items:center;padding:12px}
.icard .ic{grid-area:ic;display:grid;place-items:center;width:56px;height:56px;border-radius:14px;background:rgba(16,18,43,.35);border:2px solid var(--ink)}
.icard .ic svg{width:42px;height:auto}
.icard .im{grid-area:im;display:grid;gap:2px;min-width:0}
.icard .im b{font-family:var(--f-disp);font-weight:400;font-size:1.05rem}
.icard .im small{color:var(--muted);font-size:.82rem}
.icard .im small.d{color:#d8c9ff}
.icard .ia{grid-area:ia;display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-start}
.icard .ia .tag{margin-top:0}
.icard.owned{opacity:.75}
.lv{font-style:normal;color:var(--yolk)}
@media (min-width:560px){.icard{grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"ic im ia"}.icard .ia{justify-content:flex-end}}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tab{padding:11px 6px;border:3px solid var(--ink);border-radius:12px;background:var(--panel);font-family:var(--f-disp);font-size:1rem;box-shadow:0 4px 0 var(--ink)}
.tab[aria-selected="true"]{background:var(--yolk);color:var(--ink)}
.empty{margin:10px 0;text-align:center;color:var(--muted)}

/* 랭킹 */
.mycard{display:grid;grid-template-columns:auto auto minmax(0,1fr);align-items:center;gap:14px;padding:14px;background:var(--panel-2);border-color:var(--ink)}
.mycard small{display:block;color:var(--muted);font-size:.8rem}
.mi b{font-size:1.9rem;color:var(--yolk)}
.ms{text-align:right;min-width:0}
.ms b{font-size:1.5rem}
.rlist{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.rrow{display:grid;grid-template-columns:2.2em auto minmax(0,1fr) auto;align-items:center;gap:10px;padding:9px 12px;border-radius:14px;box-shadow:0 4px 0 var(--ink)}
.rrow.me{border-color:var(--yolk);background:var(--panel-2)}
.rk{font-size:1.35rem;text-align:center;color:var(--muted)}
.rk.g1{color:var(--yolk)}.rk.g2{color:#e6ecff}.rk.g3{color:#f0a868}
.rn{min-width:0;display:grid}
.rn b{font-family:var(--f-disp);font-weight:400;font-size:1.05rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rn small{color:var(--muted);font-size:.78rem}
.rs{font-size:1.2rem;color:var(--yolk);text-align:right}

/* 채팅 */
#chatScroll{display:flex;flex-direction:column}
.chat-note{margin:0 auto 12px;max-width:760px;width:100%;text-align:center;font-size:.8rem;color:var(--muted)}
.chatlist{max-width:760px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.cmsg{display:flex;align-items:flex-end;gap:8px;max-width:86%}
.cmsg.mine{align-self:flex-end}
.mb{min-width:0;display:grid;gap:3px}
.mh{margin:0 0 0 2px;font-size:.76rem;color:var(--muted)}
.mh b{font-family:var(--f-disp);font-weight:400;color:#fff}
.mh.r{text-align:right;margin:0 2px 0 0}
.bub{margin:0;padding:8px 12px;background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:14px 14px 14px 4px;box-shadow:0 3px 0 var(--ink);font-size:1rem;overflow-wrap:anywhere;-webkit-user-select:text;user-select:text}
.mine .bub{background:var(--yolk);border-radius:14px 14px 4px 14px}
.chatbar{display:flex;gap:8px;padding-inline:16px;padding-block:10px;background:var(--panel);border-top:3px solid var(--ink)}
.chatbar input{flex:1;min-width:0;font-family:var(--f-ui);font-size:1rem;padding:10px 12px;border-radius:12px;border:3px solid var(--ink);background:var(--paper);color:var(--ink)}
.chatbar input:disabled{background:#c9cde3}

/* 게임 */
#s-game{background:#141c47;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}

/* 모달 / 알림 */
.modal{position:absolute;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(8,10,30,.72)}
.mbox{width:min(100%,390px);max-height:100%;overflow-y:auto;padding:20px 18px 18px;display:grid;gap:12px;text-align:center}
.mbox h2{margin:0;font-family:var(--f-disp);font-weight:400;font-size:2rem;line-height:1.1;text-shadow:var(--ol)}
.mbox h2.win{color:var(--yolk)}.mbox h2.lose{color:var(--rose)}.mbox h2.sm{font-size:1.55rem}
.mbox .sub{margin:0}
.eyebrow{margin:0;font-family:var(--f-num);font-size:.85rem;letter-spacing:.12em;color:var(--muted)}
.res{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.res>div{display:grid;gap:2px;padding:8px;border-radius:12px;background:rgba(16,18,43,.4);border:2px solid var(--ink)}
.res>div.big,.res>div.wide{grid-column:1/-1}
.res span{font-size:.8rem;color:var(--muted)}
.res b{font-size:1.25rem;font-weight:400}
.res .big b{font-size:2rem;color:var(--yolk)}
.earn{display:flex;align-items:center;justify-content:center;gap:8px;font-size:1.5rem;color:var(--yolk)}
.earn .coin{width:1.3em;height:1.3em}
.earn span{font-size:1rem;color:#fff}
.best{color:var(--mint);font-weight:400}
.mbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.mbtns.col{grid-template-columns:1fr}
.mbtns .btn:only-child{grid-column:1/-1}
textarea{-webkit-user-select:text;user-select:text}
.copyres{justify-self:center;white-space:normal;text-align:center}
.copybox{width:100%;font-family:var(--f-ui);font-size:.95rem;line-height:1.4;padding:10px 12px;border-radius:12px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);resize:none}
.acc-top{display:grid;justify-items:center;gap:8px}
.upg-item{display:flex;align-items:center;justify-content:center;gap:10px;font-family:var(--f-disp);font-size:1.2rem}
.upg-item .ic svg{width:48px;height:auto}
.upg-lv{display:flex;align-items:center;justify-content:center;gap:14px}
.lvl{font-size:2.4rem;color:#fff;text-shadow:var(--ol)}
.lvl.nx{color:var(--yolk)}
.arrow{font-size:1.6rem;color:var(--muted)}
.rate.hi{color:var(--mint)}.rate.mid{color:var(--yolk)}.rate.lo{color:var(--rose)}
.down{color:#ffc2cc}
.forge{height:12px;border-radius:999px;background:rgba(16,18,43,.5);border:2px solid var(--ink);overflow:hidden}
.forge i{display:block;height:100%;width:0;background:var(--yolk)}
.forge.go i{animation:forge .95s ease-in forwards}
.upg-res{margin:0;min-height:1.5em;font-family:var(--f-disp);font-size:1.25rem}
.upg-res.good{color:var(--mint)}.upg-res.bad{color:var(--rose)}
.toasts{position:absolute;left:50%;top:74px;transform:translateX(-50%);z-index:60;display:grid;gap:8px;justify-items:center;width:min(calc(100% - 32px),420px);pointer-events:none}
.toast{background:var(--ink);color:#fff;border:2px solid rgba(255,255,255,.25);border-radius:999px;padding:8px 16px;font-size:.95rem;text-align:center;box-shadow:0 4px 0 rgba(0,0,0,.35);animation:tin .22s ease-out;transition:opacity .3s}
.toast.good{background:#146b3e}.toast.bad{background:#7d1a33}
.toast.out{opacity:0}

.hero{background:none;border:0;color:inherit;font:inherit;cursor:pointer}
.hero:active .hero-ball{transform:scale(.96)}
.ball.xl{width:112px;height:112px;border-width:4px;box-shadow:0 5px 0 var(--ink)}
.ball.xl img{inset:4px;width:calc(100% - 8px);height:calc(100% - 8px)}
.chprev{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:start;padding:16px}
.chpic{display:grid;justify-items:center;gap:10px}
.role{display:inline-block;padding:3px 12px;border-radius:999px;background:var(--ink);color:var(--yolk);font-size:.82rem}
.chinfo{display:grid;gap:8px;min-width:0}
.chinfo h3{margin:0;font-family:var(--f-disp);font-weight:400;font-size:1.7rem;line-height:1.1;text-shadow:var(--ol)}
.chinfo .cd{margin:0;color:var(--muted);font-size:.88rem}
.sbar{display:grid;grid-template-columns:2.4em minmax(0,1fr) 3.4em;align-items:center;gap:8px;font-size:.82rem}
.sbar i{display:block;height:11px;border-radius:999px;background:rgba(16,18,43,.5);border:2px solid var(--ink);overflow:hidden}
.sbar i b{display:block;height:100%;background:var(--yolk)}
.sbar em{font-style:normal;text-align:right}
.ultbox{display:grid;gap:3px;padding:9px 11px;border-radius:12px;background:rgba(160,124,255,.2);border:2px solid var(--ink);text-align:left}
.ultbox b{font-family:var(--f-disp);font-weight:400;color:#e2d6ff}
.ultbox span{font-size:.85rem}
.chact{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}
.chact .tag{margin-top:0;font-size:.95rem;padding:8px 14px}
.chgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px}
.chtile{position:relative;display:grid;justify-items:center;align-content:start;gap:3px;padding:10px 6px 9px;text-align:center;transition:transform .07s}
.chtile:active{transform:translateY(3px)}
.chtile b{font-family:var(--f-disp);font-weight:400;font-size:.95rem;margin-top:2px}
.chtile small{display:inline-flex;align-items:center;gap:4px;font-size:.76rem;color:var(--muted)}
.chtile .lockic{top:6px;right:6px}
.chtile .lockic svg{width:20px;height:20px}
.chtile.view{border-color:var(--sky);box-shadow:0 5px 0 var(--ink),0 0 0 3px var(--sky)}
.chtile.sel small{color:var(--yolk)}
@media (max-width:440px){.chprev{grid-template-columns:1fr;justify-items:center}.chinfo{width:100%}.chinfo h3,.chinfo .cd{text-align:center}.chact{justify-content:center}}
@keyframes bob{50%{transform:translateY(-10px)}}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-10px)}}
@keyframes tin{from{transform:translateY(-8px);opacity:0}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes forge{to{width:100%}}
@media (max-width:380px){.hero{padding-inline:88px}.sbtn{width:64px}}
@media (max-height:520px){.side{top:6px;gap:8px}.sbtn{padding:5px 4px 4px;font-size:.8rem}.sbtn svg{width:24px;height:24px}.hero-meta{display:none}.play{padding:12px 22px;font-size:1.25rem}}
@media (prefers-reduced-motion:reduce){.hero-ball,.roster>span{animation:none}.forge.go i{animation-duration:.2s}}
</style>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>window.FB_CONFIG = window.FB_CONFIG || {};</script>

<body>
<div id="app">
  <section id="s-title" class="scr" aria-label="시작">
    <div class="title-in">
      <h1 class="logo"><span class="a">호준</span><span class="b">브롤</span></h1>
      <div class="roster" id="roster" aria-hidden="true"></div>
      <div class="auth card" id="authBox"><p class="loading">계정 확인 중...</p></div>
      <p class="savenote" id="saveNote"></p>
    </div>
  </section>

  <section id="s-lobby" class="scr" aria-label="로비" hidden>
    <header class="topbar">
      <button class="me" id="meChip" type="button" aria-label="내 계정 정보">
        <span id="meBall"></span>
        <span class="me-t"><b id="meNick">호준</b><span class="me-s"><i class="tro"></i><span class="num" id="meTotal">0</span></span></span>
      </button>
      <div class="tb-r">
        <span class="chip"><i class="coin"></i><b class="num coinTxt">0</b></span>
        <button class="icon-btn" id="btnSound" type="button" aria-label="소리 끄기"></button>
      </div>
    </header>
    <div class="stage">
      <div class="floor" aria-hidden="true"></div>
      <nav class="side l" aria-label="같이 하기">
        <button class="sbtn" id="bRank" type="button"><span>랭킹</span></button>
        <button class="sbtn" id="bChat" type="button"><span>채팅</span><i class="dot" id="chatDot" hidden></i></button>
      </nav>
      <nav class="side r" aria-label="준비">
        <button class="sbtn" id="bChars" type="button"><span>캐릭터</span></button>
        <button class="sbtn" id="bGear" type="button"><span>장비</span></button>
        <button class="sbtn" id="bShop" type="button"><span>상점</span></button>
      </nav>
      <button class="hero" id="heroBtn" type="button" aria-label="캐릭터 바꾸기">
        <span class="ball hero-ball" id="heroBall"><img id="heroImg" alt="" draggable="false"></span>
        <span class="hero-shadow" aria-hidden="true"></span>
        <b class="hero-name" id="heroName">기본 호준</b>
        <span class="hero-meta" id="heroMeta"></span>
      </button>
    </div>
    <div class="playbar">
      <button class="btn big play" id="bPlay" type="button">게임 시작</button>
      <p class="mode-note" id="modeNote"></p>
    </div>
  </section>

  <section id="s-game" class="scr" aria-label="게임" hidden><canvas id="cv" aria-label="게임 화면"></canvas></section>

  <section id="s-gear" class="scr panel" aria-label="장비" hidden>
    <header class="phead"><button class="back" type="button" data-back aria-label="로비로"></button><h2>장비</h2><span class="chip"><i class="coin"></i><b class="num coinTxt">0</b></span></header>
    <div class="pbody" id="gearBody"></div>
  </section>

  <section id="s-chars" class="scr panel" aria-label="캐릭터" hidden>
    <header class="phead"><button class="back" type="button" data-back aria-label="로비로"></button><h2>캐릭터</h2><span class="chip"><i class="coin"></i><b class="num coinTxt">0</b></span></header>
    <div class="pbody" id="charsBody"></div>
  </section>

  <section id="s-shop" class="scr panel" aria-label="상점" hidden>
    <header class="phead"><button class="back" type="button" data-back aria-label="로비로"></button><h2>상점</h2><span class="chip"><i class="coin"></i><b class="num coinTxt">0</b></span></header>
    <div class="pbody" id="shopBody"></div>
  </section>

  <section id="s-rank" class="scr panel" aria-label="랭킹" hidden>
    <header class="phead"><button class="back" type="button" data-back aria-label="로비로"></button><h2>누적 점수 랭킹</h2></header>
    <div class="pbody" id="rankBody"></div>
  </section>

  <section id="s-chat" class="scr panel" aria-label="전체 채팅" hidden>
    <header class="phead"><button class="back" type="button" data-back aria-label="로비로"></button><h2>전체 채팅</h2></header>
    <div class="pbody" id="chatScroll"><p class="chat-note" id="chatNote"></p><div class="chatlist" id="chatList"></div></div>
    <form class="chatbar" id="chatForm"><label for="chatIn" class="sr">메시지</label><input id="chatIn" maxlength="80" autocomplete="off" placeholder="메시지 보내기"><button class="btn small" type="submit" id="chatSend">보내기</button></form>
  </section>

  <div class="modal" id="modal" hidden><div class="mbox card" id="mbox" role="dialog" aria-modal="true"></div></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
</div>

/* ================= 계정 / 저장 =================
   online   : 공유 DB에 저장 (players/<id> 공개 기록, data/users/<id>/save 비공개 지갑·장비, chat/<id> 내 메시지)
   readonly : 공유 DB는 읽기만 가능 → 내 기록은 이 기기(localStorage)에 저장
   local    : 공유 DB 없음 → 이 기기에만 저장, 랭킹·채팅 없음                         */
const LS_KEY = 'hojun-brawl-v1';
const LS_CHAT_SEEN = 'hojun-brawl-chatseen';

function newProfile(nick) {
  return {
    nick, ch: 'base', pic: '', total: 0, best: 0, games: 0, clears: 0,
    coins: 300, chars: ['base'], wpn: { blaster: 0 }, arm: { gym: 0 },
    pot: { hp: 2, shield: 0, rage: 0, ult: 0 }, eq: { w: 'blaster', a: 'gym', p: 'hp' },
  };
}
function lvMap(src, table, must) {
  const o = {};
  if (src && typeof src === 'object') for (const k of Object.keys(table)) if (k in src) o[k] = clamp(num(src[k]), 0, UPG_MAX);
  if (!(must in o)) o[must] = 0;
  return o;
}
function normProfile(pub, priv) {
  const P = newProfile(str(pub && pub.nick, 8) || '호준');
  if (pub) { P.ch = CHARS[pub.ch] ? pub.ch : 'base'; P.pic = validPic(pub.pic) ? pub.pic : ''; for (const k of ['total', 'best', 'games', 'clears']) P[k] = num(pub[k]); }
  if (priv) {
    P.coins = num(priv.coins, 300);
    const raw = Array.isArray(priv.chars) ? priv.chars : [];
    for (const k of new Set(raw)) if (RETIRED_CHARS[k]) P.coins += RETIRED_CHARS[k];
    P.chars = [...new Set(raw.filter(k => CHARS[k]))];
    if (!P.chars.includes('base')) P.chars.unshift('base');
    P.wpn = lvMap(priv.wpn, WEAPONS, 'blaster');
    P.arm = lvMap(priv.arm, ARMORS, 'gym');
    const pt = priv.pot || {};
    for (const k of P_ORDER) P.pot[k] = num(pt[k]);
    const eq = priv.eq || {};
    P.eq = { w: eq.w in P.wpn ? eq.w : 'blaster', a: eq.a in P.arm ? eq.a : 'gym', p: POTIONS[eq.p] ? eq.p : 'hp' };
  }
  if (!P.chars.includes(P.ch)) P.ch = 'base';
  return P;
}
/* 프로필 사진: 작은 JPEG 데이터만 허용 */
const validPic = v => typeof v === 'string' && v.length < 40000 && /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/]+=*$/.test(v);
const validMsg = m => m && typeof m.t === 'number' && isFinite(m.t) && typeof m.x === 'string' && m.x.length > 0;

/* ---------- 웹사이트 버전 아이디 로그인 (Firebase 이메일/비밀번호를 아이디용으로 씀, 메일은 안 감) ---------- */
const ID_RE = /^[가-힣a-z0-9_]{2,10}$/;        // 새로 만들거나 바꿀 때
const ID_LOGIN_RE = /^[가-힣a-z0-9_]{2,12}$/;  // 로그인할 때 (예전 12자 아이디 포함)
const ID_DOMAIN = '@hojun-brawl.example.com';
const normId = s => String(s || '').normalize('NFC').trim().toLowerCase();
const toHex = t => Array.from(new TextEncoder().encode(t), b => b.toString(16).padStart(2, '0')).join('');
const fromHex = h => { try { return new TextDecoder().decode(new Uint8Array(h.match(/../g).map(x => parseInt(x, 16)))); } catch (e) { return h; } };
/* 한글 아이디는 메일 주소에 못 써서 'k.' + 16진수로 바꿔 씀 */
const idEmail = id => (/^[a-z0-9_]+$/.test(id) ? id : 'k.' + toHex(id)) + ID_DOMAIN;
const emailId = e => {
  e = String(e || '');
  const l = e.endsWith(ID_DOMAIN) ? e.slice(0, -ID_DOMAIN.length) : e.split('@')[0];
  return /^k\.[0-9a-f]+$/.test(l) ? fromHex(l.slice(2)) : l;
};
function authErrMsg(e, up) {
  const c = (e && e.code) || '';
  const M = {
    'auth/email-already-in-use': '이미 누가 쓰고 있는 아이디예요',
    'auth/weak-password': '비밀번호가 너무 짧아요. 6자 이상으로 해주세요',
    'auth/too-many-requests': '너무 여러 번 시도했어요. 잠시 뒤에 다시 해주세요',
    'auth/network-request-failed': '인터넷 연결을 확인해 주세요',
    'auth/operation-not-allowed': 'Firebase에서 이메일/비밀번호 로그인이 아직 꺼져 있어요',
    'auth/admin-restricted-operation': 'Firebase에서 이메일/비밀번호 로그인이 아직 꺼져 있어요',
    'auth/configuration-not-found': 'Firebase에서 Authentication을 아직 시작하지 않았어요',
    'auth/user-disabled': '사용이 막힌 아이디예요',
  };
  if (M[c]) return M[c];
  if (!up && /invalid-credential|wrong-password|user-not-found|invalid-login-credentials|invalid-email|missing-password/.test(c)) return '아이디나 비밀번호가 틀렸어요';
  if (up && c === 'auth/invalid-email') return '쓸 수 없는 아이디예요';
  if (/api-key|app-not-authorized/.test(c)) return 'Firebase 설정 값이 잘못 들어갔어요 (' + c + ')';
  return (up ? '가입하지 못했어요' : '로그인하지 못했어요') + ' (' + (c || '알 수 없는 오류') + ')';
}
function fsErrMsg(e) {
  const c = (e && e.code) || '';
  if (c === 'permission-denied') return 'Firestore 규칙이 막고 있어요 (규칙을 게시했는지 확인)';
  if (c === 'not-found' || c === 'failed-precondition') return 'Firestore 데이터베이스가 아직 없어요';
  if (c === 'unavailable') return '서버에 연결할 수 없어요. 인터넷을 확인해 주세요';
  return '서버 오류 (' + (c || '알 수 없음') + ')';
}

const Store = {
  mode: 'loading', db: null, user: null, uid: null, P: null, web: false, webErr: '',
  auth: null, loginId: '', loadErr: '', kicked: false,
  sess: Math.random().toString(36).slice(2, 10) + Date.now().toString(36),
  pics: {}, rank: [], rankState: 'idle', chat: [], myChat: [], chatState: 'idle', lastSend: 0,
  _subs: {}, _w: {}, _started: false, _claimed: false, _unSess: null,

  on(ev, fn) { (this._subs[ev] = this._subs[ev] || new Set()).add(fn); },
  emit(ev) { (this._subs[ev] || []).forEach(f => { try { f(); } catch (e) { console.error(e); } }); },

  async init() {
    const cfg = window.FB_CONFIG;
    if (cfg) {
      /* 웹사이트 버전: Firebase 아이디(이메일/비밀번호) 로그인 + Firestore. 로그인 상태는 Firebase가 브라우저에 기억해 둠 */
      this.web = true;
      if (!window.firebase || !cfg.apiKey || /여기에/.test(String(cfg.apiKey))) { this.mode = 'local'; this.webErr = 'Firebase 설정이 아직 안 들어갔어요'; return; }
      try {
        if (!firebase.apps.length) firebase.initializeApp(cfg);
        this.auth = firebase.auth();
        this.db = firebase.firestore();
        const u = await new Promise((res, rej) => {
          let done = false, un = null;
          const fin = (f, v) => { if (done) return; done = true; clearTimeout(to); if (un) un(); f(v); };
          const to = setTimeout(() => fin(rej, { code: 'auth/timeout' }), 15000);
          un = this.auth.onAuthStateChanged(x => fin(res, x), e => fin(rej, e));
          if (done && un) un();
        });
        if (u && !u.isAnonymous) this.setUser(u);
        this.mode = 'online';
      } catch (e) { console.warn(e); this.mode = 'local'; this.auth = null; this.db = null; this.webErr = 'Firebase 연결 실패 (' + ((e && e.code) || '알 수 없는 오류') + ')'; }
      return;
    }
    const C = window.claude;
    if (!C || typeof C.use !== 'function') { this.mode = 'local'; return; }
    let db = null, user = null;
    try { [db, user] = await Promise.all([C.use('db'), C.use('user')]); } catch (e) { db = null; }
    this.db = db; this.user = user;
    if (!db) { this.mode = 'local'; return; }
    let uid = null, canW = null;
    if (user) {
      try { uid = await user.id(); } catch (e) { uid = null; }
      try { canW = await user.can('data.write'); } catch (e) { canW = null; }
    }
    this.uid = uid;
    this.mode = !uid || canW === false ? 'readonly' : 'online';
  },

  setUser(u) { this.uid = u.uid; this.loginId = emailId(u.email); },

  async loadAccount() {
    if (this.web && this.mode === 'online') {
      if (!this.uid) return 'signin';
      try {
        const [a, b] = await Promise.all([
          this.db.doc('players/' + this.uid).get(),
          this.db.doc('data/users/' + this.uid + '/save').get(),
        ]);
        if (a.exists) { this.P = normProfile(a.data(), b.exists ? b.data() : null); return 'login'; }
        return 'create';
      } catch (e) { console.warn('account load failed', e); this.loadErr = fsErrMsg(e); return 'error'; }
    }
    if (this.mode === 'online') {
      try {
        const [a, b] = await Promise.all([
          this.db.doc('players/' + this.uid).get(),
          this.db.doc('data/users/' + this.uid + '/save').get(),
        ]);
        if (a.exists) { this.P = normProfile(a.data(), b.exists ? b.data() : null); return 'login'; }
        return 'create';
      } catch (e) { console.warn('account load failed', e); this.mode = 'readonly'; }
    }
    const raw = lsGet(LS_KEY);
    if (raw) {
      try { const o = JSON.parse(raw); if (o && o.P && o.P.nick) { this.P = normProfile(o.P, o.P); return 'login'; } } catch (e) { /* 손상된 기록은 무시 */ }
    }
    return 'create';
  },

  async nickTaken(nick) {
    if (!this.db) return false;
    try {
      const s = await this.db.collection('players').where('nick', '==', nick).limit(3).get();
      return s.docs.some(d => d.id !== this.uid);
    } catch (e) { return false; }
  },

  /* 웹사이트 버전: 서버 연결 전에 이 기기에만 저장된 기록 (새 아이디로 한 번만 옮김) */
  localProfile() {
    if (lsGet(LS_KEY + '-moved')) return null;
    try { const o = JSON.parse(lsGet(LS_KEY) || 'null'); return o && o.P && o.P.nick ? normProfile(o.P, o.P) : null; } catch (e) { return null; }
  },
  async create(nick) {
    const old = this.web && this.mode === 'online' ? this.localProfile() : null;
    this.P = old ? Object.assign(old, { nick }) : newProfile(nick);
    this.moved = !!old;
    if (this.mode === 'online') {
      try {
        await this.db.doc('players/' + this.uid).set(this.pubData());
        await this.db.doc('data/users/' + this.uid + '/save').set(this.privData());
        if (old) lsSet(LS_KEY + '-moved', '1');
        return;
      } catch (e) { this.downgrade(e); }
    }
    this.localSave();
  },

  /* ---------- 아이디 가입 / 로그인 / 로그아웃 (웹사이트 버전) ---------- */
  async signUp(id, pw) {
    try { const c = await this.auth.createUserWithEmailAndPassword(idEmail(id), pw); this.setUser(c.user); return { ok: true }; }
    catch (e) { console.warn(e); return { ok: false, code: (e && e.code) || '', msg: authErrMsg(e, true) }; }
  },
  async signIn(id, pw) {
    try { const c = await this.auth.signInWithEmailAndPassword(idEmail(id), pw); this.setUser(c.user); return { ok: true }; }
    catch (e) { console.warn(e); return { ok: false, code: (e && e.code) || '', msg: authErrMsg(e, false) }; }
  },
  async settle(ms) {
    const t0 = Date.now();
    while (Object.values(this._w).some(w => w.busy || w.next) && Date.now() - t0 < ms) await sleep(100);
  },
  async logout() {
    this.stopWatch();
    await this.settle(3000);
    try { if (this.auth) await this.auth.signOut(); } catch (e) { console.warn(e); }
    location.reload();
  },
  /* 마지막으로 들어온 기기가 계정을 차지함. 예전 기기(켜 둔 탭 등)가 옛날 코인으로 덮어쓰지 않게 연결을 끊음 */
  async claim() {
    if (!this.web || this.mode !== 'online' || !this.uid || !this.P || this._claimed) return;
    this._claimed = true;
    const path = 'data/users/' + this.uid + '/save';
    try { await this.db.doc(path).set(this.privData()); } catch (e) { this.downgrade(e); return; }
    try {
      this._unSess = this.db.doc(path).onSnapshot(s => {
        if (this.kicked || this.mode !== 'online' || !s || !s.exists) return;
        if (s.metadata && s.metadata.hasPendingWrites) return;
        const d = s.data() || {};
        if (d.sess && d.sess !== this.sess) this.kick();
      }, e => console.warn('session watch failed', e));
    } catch (e) { console.warn(e); }
  },
  /* ---------- 프로필 수정 ---------- */
  picOf(uid) { return uid === this.uid && this.P ? this.P.pic : (this.pics && this.pics[uid]) || ''; },
  setPic(pic) { this.P.pic = validPic(pic) ? pic : ''; this.save('pub'); },
  async changeNick(nick) {
    if (await this.nickTaken(nick)) return { ok: false, msg: '이미 누가 쓰고 있는 닉네임이에요' };
    this.P.nick = nick; this.save('pub');
    if (this.mode === 'online' && this.myChat.length) this.write('chat/' + this.uid, { nick, ch: this.P.ch, msgs: this.myChat });
    return { ok: true };
  },
  async changeAccount(newId, newPw, curPw) {
    const u = this.auth && this.auth.currentUser;
    if (!u) return { ok: false, msg: '로그인 상태가 아니에요. 다시 로그인해 주세요' };
    try { await u.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(u.email, curPw)); }
    catch (e) { const c = (e && e.code) || ''; return { ok: false, f: 'cur', msg: /invalid-credential|wrong-password|invalid-login|user-mismatch/.test(c) ? '지금 비밀번호가 틀렸어요' : authErrMsg(e, false) }; }
    let idDone = false;
    if (newId && newId !== this.loginId) {
      try { await u.updateEmail(idEmail(newId)); this.loginId = newId; idDone = true; }
      catch (e) {
        const c = (e && e.code) || '';
        return { ok: false, f: 'id', msg: c === 'auth/email-already-in-use' ? '이미 누가 쓰고 있는 아이디예요' : c === 'auth/operation-not-allowed' ? 'Firebase에서 "이메일 열거 보호"를 꺼야 아이디를 바꿀 수 있어요' : '아이디를 바꾸지 못했어요 (' + (c || '알 수 없는 오류') + ')' };
      }
    }
    if (newPw) {
      try { await u.updatePassword(newPw); }
      catch (e) { const c = (e && e.code) || ''; return { ok: false, f: 'pw', msg: (idDone ? '아이디는 바뀌었는데 ' : '') + (c === 'auth/weak-password' ? '새 비밀번호가 너무 짧아요' : '비밀번호를 바꾸지 못했어요 (' + (c || '알 수 없는 오류') + ')') }; }
    }
    return { ok: true };
  },
  stopWatch() { try { if (this._unSess) this._unSess(); } catch (e) { /* 무시 */ } this._unSess = null; },
  kick() {
    this.kicked = true; this.mode = 'readonly'; this.webErr = '다른 기기에서 이 아이디로 접속했어요';
    this.stopWatch();
    this.emit('kick');
  },

  downgrade(e) {
    console.warn('db write refused', e);
    if (this.web && !this.kicked) this.webErr = fsErrMsg(e);
    if (this.mode === 'online') { this.mode = 'readonly'; this.localSave(); this.emit('mode'); }
  },
  pubData() { const P = this.P; return { nick: P.nick, ch: P.ch, pic: P.pic || '', total: P.total, best: P.best, games: P.games, clears: P.clears, upd: Date.now() }; },
  privData() {
    const P = this.P, o = { coins: P.coins, chars: P.chars.slice(), wpn: { ...P.wpn }, arm: { ...P.arm }, pot: { ...P.pot }, eq: { ...P.eq }, v: 1 };
    if (this.web) o.sess = this.sess;
    return o;
  },
  localSave() { if (this.P) lsSet(LS_KEY, JSON.stringify({ P: this.P })); },

  save(which = 'all') {
    if (!this.P || this.kicked) return;
    if (this.mode !== 'online') { this.localSave(); return; }
    if (which !== 'priv') this.write('players/' + this.uid, this.pubData());
    if (which !== 'pub') this.write('data/users/' + this.uid + '/save', this.privData());
  },
  /* 문서마다 한 번에 하나씩만 쓰고, 밀린 건 마지막 값으로 합쳐서 씀 */
  write(path, data) {

          <button class="btn big" type="submit" id="bCreate">${webId ? '시작하기' : '계정 만들고 시작'}</button>
          <p class="gift"><i class="coin"></i> 가입 선물 300코인 + 체력 포션 2개</p>
          ${webId ? '<button class="linkbtn" type="button" id="bOut">다른 아이디로 로그인</button>' : ''}
        </form>`;

      if (webId) $('#bOut').addEventListener('click', onLogout);
      return;
    }

    box.innerHTML = `
      <div class="authf">
        <h2>로그인</h2>
        <div class="who">${avatarHTML(P.pic, P.ch, 'l')}<span><b>${esc(P.nick)}</b><small>누적 ${fmt(P.total)}점 · 코인 ${fmt(P.coins)}</small></span></div>
        <button class="btn big" type="button" id="bLogin" data-focus>${webId ? esc(ro(P.nick)) + ' 시작하기' : esc(P.nick) + '(으)로 로그인'}</button>
        <p class="msg">${note}</p>
        ${webId ? '<button class="linkbtn" type="button" id="bOut">다른 아이디로 로그인</button>' : ''}
      </div>`;
    $('#bLogin').addEventListener('click', () => { SFX.init(); sfx('click'); enterLobby(); });

  },
  /* 웹사이트 버전: 아이디 로그인 / 회원가입 */

          ${idField('inId')}

          <p class="msg" id="authMsg">처음이면 아래 회원가입을 눌러 주세요</p>

          <div class="field"><label for="upPw2">비밀번호 확인</label><input id="upPw2" type="password" maxlength="64" autocomplete="new-password" enterkeyhint="next"></div>
          <div class="field"><label for="upNick">닉네임 <small>게임에 보이는 이름 · 2~8글자</small></label><input id="upNick" maxlength="8" autocomplete="off" spellcheck="false" enterkeyhint="done" value="${old ? esc(old.nick) : ''}"></div>

          <button class="btn big" type="submit" id="bSignUp">가입하고 시작</button>
          <p class="gift"><i class="coin"></i> ${old ? `이 기기에 있던 기록(코인 ${fmt(old.coins)} · 누적 ${fmt(old.total)}점)이 새 아이디로 옮겨져요` : '가입 선물 300코인 + 체력 포션 2개'}</p>
          <button class="linkbtn" type="button" id="toIn">이미 아이디가 있어요? <b>로그인</b></button>
        </form>`;
      $('#fUp').addEventListener('submit', onSignUp);

    }
    $('#saveNote').textContent = modeNote();
  },

    this.modal(`
      <h2>프로필 수정</h2>
      <section class="pf">
        <h3>프로필 사진</h3>
        <div class="pf-pic"><span id="pfBall">${avatarHTML(P.pic, P.ch, 'l')}</span>
          <div class="pf-btns"><label class="btn small blue" for="pfFile">사진 올리기</label><input type="file" id="pfFile" accept="image/*" hidden><button class="btn small ghost" type="button" id="pfReset">캐릭터 얼굴로</button></div></div>
        <p class="msg" id="pfPicMsg">사진은 랭킹이랑 채팅에서 모두에게 보여요</p>
      </section>
      <form class="pf" id="pfNickF" novalidate>
        <h3>닉네임</h3>

        <div class="field"><label for="pfPw">새 비밀번호 <small>안 바꾸려면 비워 두기</small></label><input id="pfPw" type="password" maxlength="64" autocomplete="new-password"></div>
        <div class="field"><label for="pfPw2">새 비밀번호 확인</label><input id="pfPw2" type="password" maxlength="64" autocomplete="new-password"></div>
        <div class="field"><label for="pfCur">지금 비밀번호 <small>바꾸려면 꼭 입력</small></label><input id="pfCur" type="password" maxlength="64" autocomplete="current-password"></div>
        <p class="msg" id="pfAccMsg"></p>
        <button class="btn" type="submit" id="pfAccBtn">아이디·비밀번호 저장</button>
      </form>` : ''}
      <div class="mbtns"><button class="btn ghost" type="button" id="pfBack">뒤로</button><button class="btn" type="button" data-close data-focus>닫기</button></div>`, true);
    const closeAll = () => { this.closeModal(); if (this.cur === 'lobby') this.renderLobby(); };
    $('#mbox [data-close]').addEventListener('click', closeAll);
    $('#pfBack').addEventListener('click', () => { sfx('click'); if (this.cur === 'lobby') this.renderLobby(); this.showAccount(); });
    const picMsg = (t, bad) => { const m = $('#pfPicMsg'); m.textContent = t; m.className = 'msg' + (bad ? ' err' : ''); };
    $('#pfFile').addEventListener('change', async e => {
      const f = e.target.files && e.target.files[0]; e.target.value = '';
      if (!f) return;
      if (!/^image\//.test(f.type || 'image/')) { picMsg('사진 파일만 올릴 수 있어요', true); sfx('fail'); return; }
      picMsg('사진 줄이는 중...');
      try {
        const pic = await shrinkPic(f);
        Store.setPic(pic); $('#pfBall').innerHTML = avatarHTML(pic, P.ch, 'l');
        picMsg('프로필 사진을 바꿨어요!'); sfx('up');
      } catch (err) { console.warn(err); picMsg('이 사진은 못 읽었어요. 다른 사진으로 해 주세요', true); sfx('fail'); }
    });
    $('#pfReset').addEventListener('click', () => {
      sfx('click'); Store.setPic(''); $('#pfBall').innerHTML = avatarHTML('', P.ch, 'l'); picMsg('캐릭터 얼굴로 돌려놨어요');
    });
    $('#pfNickF').addEventListener('submit', async e => {
      e.preventDefault();
      const inp = $('#pfNick'), m = $('#pfNickMsg'), nick = inp.value.trim();
      const bad = t => { m.textContent = t; m.className = 'msg err'; sfx('fail'); };
      if (nick === P.nick) return bad('지금 닉네임이랑 같아요');
      if (!NICK_RE.test(nick)) return bad('닉네임은 2~8글자, 한글·영어·숫자만 돼요');
      if (clean(nick) !== nick) return bad('쓸 수 없는 단어가 들어 있어요');
      const btn = e.target.querySelector('button'); btn.disabled = true; m.className = 'msg'; m.textContent = '확인 중...';
      const r = await Store.changeNick(nick); btn.disabled = false;
      if (!r.ok) return bad(r.msg);
      m.textContent = `${ro(nick)} 바꿨어요!`; sfx('up');
      $('#mbox h2').textContent = '프로필 수정';
    });
    if (web) $('#pfAccF').addEventListener('submit', onAccountChange);
  },

  /* ---------- 로비 ---------- */
  renderLobby() {
    const P = Store.P; if (!P) return;
    const ch = CHARS[P.ch];
    $('#meBall').innerHTML = avatarHTML(P.pic, P.ch, 's');
    $('#meNick').textContent = P.nick;
    $('#meTotal').textContent = fmt(P.total);
    const hb = $('#heroBall'); hb.style.setProperty('--ring', ch.ring); $('#heroImg').src = FACES[ch.face];
    $('#heroName').textContent = ch.name;
    const po = POTIONS[P.eq.p], pn = Math.min(POT_PER_GAME, P.pot[P.eq.p] || 0);
    $('#heroMeta').innerHTML = `<span>${esc(WEAPONS[P.eq.w].name)} <b class="num">+${P.wpn[P.eq.w]}</b></span><span>${esc(ARMORS[P.eq.a].name)} <b class="num">+${P.arm[P.eq.a]}</b></span><span>${esc(po.name)} <b class="num">${pn}개</b></span>`;
    $('#modeNote').textContent = modeNote();
    this.updateCoins();
  },

  /* ---------- 장비 ---------- */
  renderGear() {
    const P = Store.P; if (!P) return;
    let h = '';
    const itemSec = (title, sub, kind, order, tbl, owned, eq, icon, stat) => {
      let s = `<section class="sec"><h3>${title}</h3><p class="sub">${sub}</p><div class="ilist">`;
      for (const k of order) {
        const it = tbl[k], own = k in owned, lv = owned[k] || 0, sel = eq === k;
        s += `<div class="icard card${sel ? ' sel' : ''}${own ? '' : ' locked'}">
          <span class="ic">${icon(it.color)}</span>
          <span class="im"><b>${it.name}${own ? ` <em class="lv num">+${lv}</em>` : ''}</b><small>${own ? stat(k, lv) : it.desc}</small></span>
          <span class="ia">${own
            ? (sel ? '<span class="tag on">장착 중</span>' : `<button class="btn small blue" type="button" data-act="eq${kind}" data-k="${k}">장착</button>`) +
              (lv < UPG_MAX ? `<button class="btn small" type="button" data-act="up${kind}" data-k="${k}">강화</button>` : '<span class="tag on">MAX</span>')
            : `<button class="btn small ghost" type="button" data-act="shop" data-tab="gear"><i class="coin"></i> ${fmt(it.price)}</button>`}</span>
        </div>`;
      }
      return s + '</div></section>';
    };
    h += itemSec('무기', `강화 1단계마다 공격력 +${Math.round(W_UP * 100)}%, 5단계마다 탄창 +1`, 'w', W_ORDER, WEAPONS, P.wpn, P.eq.w, ICON.gun, wStat);
    h += itemSec('방어구', `강화 1단계마다 체력 +${Math.round(A_UP * 100)}%`, 'a', A_ORDER, ARMORS, P.arm, P.eq.a, ICON.shirt, aStat);
    h += `<section class="sec"><h3>포션 슬롯</h3><p class="sub">장착한 포션을 한 판에 ${POT_PER_GAME}개까지 쓸 수 있어요</p><div class="grid pgrid">`;
    for (const k of P_ORDER) {
      const po = POTIONS[k], n = P.pot[k] || 0, sel = P.eq.p === k;
      h += `<button class="pcard card${sel ? ' sel' : ''}" type="button" data-act="eqp" data-k="${k}" aria-pressed="${sel}">
        <span class="pi">${ICON.bottle(po.color)}</span><b>${po.name}</b><small>${po.desc}</small>
        <span class="tag${sel ? ' on' : ''}">보유 ${n}개${sel ? ' · 장착 중' : ''}</span></button>`;
    }
    h += '</div></section>';
    $('#gearBody').innerHTML = `<div class="pin">${h}</div>`;
  },

  /* ---------- 캐릭터 ---------- */
  renderChars() {
    const P = Store.P; if (!P) return;
    const k = CHARS[this.chView] ? this.chView : P.ch; this.chView = k;
    const c = CHARS[k], own = P.chars.includes(k), sel = P.ch === k;
    const sbar = (label, v, lo, hi, txt) => `<div class="sbar"><span>${label}</span><i><b style="width:${Math.round(clamp((v - lo) / (hi - lo), 0.08, 1) * 100)}%"></b></i><em class="num">${txt}</em></div>`;
    const armed = this.armed === 'c:' + k;
    const act = sel ? '<span class="tag on">지금 사용 중</span>'
      : own ? `<button class="btn" type="button" data-cact="pick" data-k="${k}">이 캐릭터로 하기</button>`
      : `<button class="btn${armed ? ' armed' : ''}${P.coins < c.price ? ' poor' : ''}" type="button" data-cact="buy" data-k="${k}">${armed ? '정말 살까요?' : `<i class="coin"></i> ${fmt(c.price)} 구매`}</button>`;
    let h = `<div class="chprev card">
      <div class="chpic">${ballHTML(k, 'xl')}<span class="role">${esc(c.role)}</span></div>
      <div class="chinfo">
        <h3>${esc(c.name)}</h3>
        <p class="cd">${esc(c.desc)}</p>
        ${sbar('체력', c.hp, 900, 1800, fmt(c.hp))}
        ${sbar('속도', c.spd, 220, 300, c.spd)}
        ${sbar('공격', c.dmg, 0.8, 1.15, Math.round(c.dmg * 100) + '%')}
        ${sbar('연사', c.rate, 0.85, 1.2, Math.round(c.rate * 100) + '%')}
        <div class="ultbox"><b>궁극기 · ${esc(c.ultName)}</b><span>${esc(c.ultDesc)}</span></div>
        <div class="chact">${act}</div>
      </div>
    </div>
    <div class="chgrid">`;
    for (const key of CH_ORDER) {
      const o = P.chars.includes(key), s2 = P.ch === key, cc = CHARS[key];
      h += `<button class="chtile card${key === k ? ' view' : ''}${s2 ? ' sel' : ''}${o ? '' : ' locked'}" type="button" data-cact="view" data-k="${key}" aria-pressed="${key === k}">
        ${ballHTML(key, 'm')}${o ? '' : `<span class="lockic">${ICON.lock}</span>`}<b>${esc(cc.name)}</b>
        <small>${s2 ? '사용 중' : o ? esc(cc.role) : `<i class="coin"></i> ${fmt(cc.price)}`}</small></button>`;
    }
    h += '</div>';
    $('#charsBody').innerHTML = `<div class="pin">${h}</div>`;
  },

  /* ---------- 상점 ---------- */
  renderShop() {
    const P = Store.P; if (!P) return;
    const tab = this.shopTab;
    const buyBtn = (kind, k, price) => {
      const armed = this.armed === kind + ':' + k, poor = P.coins < price;
      return `<button class="btn small buy${armed ? ' armed' : ''}${poor ? ' poor' : ''}" type="button" data-buy="${kind}" data-k="${k}">${armed ? '정말 살까요?' : `<i class="coin"></i> ${fmt(price)}`}</button>`;
    };
    let h = `<div class="tabs" role="tablist">${[['pot', '포션'], ['gear', '장비'], ['char', '캐릭터']].map(([k, n]) => `<button class="tab" type="button" role="tab" data-tab="${k}" aria-selected="${tab === k}">${n}</button>`).join('')}</div>`;
    h += '<div class="ilist">';
    if (tab === 'pot') {
      for (const k of P_ORDER) {
        const po = POTIONS[k];
        h += `<div class="icard card"><span class="ic">${ICON.bottle(po.color)}</span><span class="im"><b>${po.name}</b><small>${po.desc} · 보유 ${P.pot[k] || 0}개</small></span><span class="ia">${buyBtn('pot', k, po.price)}</span></div>`;
      }
    } else if (tab === 'gear') {
      for (const [kind, order, tbl, owned, icon] of [['w', W_ORDER, WEAPONS, P.wpn, ICON.gun], ['a', A_ORDER, ARMORS, P.arm, ICON.shirt]]) {
        for (const k of order) {
          const it = tbl[k], own = k in owned;
          if (it.price === 0) continue;
          h += `<div class="icard card${own ? ' owned' : ''}"><span class="ic">${icon(it.color)}</span><span class="im"><b>${it.name}</b><small>${kind === 'w' ? wStat(k, 0) : aStat(k, 0)}</small><small class="d">${it.desc}</small></span><span class="ia">${own ? '<span class="tag on">보유 중</span>' : buyBtn(kind, k, it.price)}</span></div>`;
        }
      }
    } else {
      for (const k of CH_ORDER) {
        const c = CHARS[k], own = P.chars.includes(k);
        if (c.price === 0) continue;
        h += `<div class="icard card${own ? ' owned' : ''}"><span class="ic">${ballHTML(k, 'm')}</span><span class="im"><b>${c.name}</b><small>체력 ${fmt(c.hp)} · 속도 ${c.spd} · ${c.desc}</small><small class="d">궁극기 ${c.ultName}: ${c.ultDesc}</small></span><span class="ia">${own ? '<span class="tag on">보유 중</span>' : buyBtn('c', k, c.price)}</span></div>`;
      }
    }
    h += '</div><p class="sub center">코인은 게임이 끝나면 점수 10점당 1코인씩 들어와요</p>';
    $('#shopBody').innerHTML = `<div class="pin">${h}</div>`;
  },

  /* ---------- 랭킹 ---------- */
  renderRank() {

/* 올린 사진을 가운데 정사각형으로 잘라 작은 JPEG로 */
function shrinkPic(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      try {
        const S = 112, cv = document.createElement('canvas'); cv.width = cv.height = S;
        const x = cv.getContext('2d'), w = img.naturalWidth, h = img.naturalHeight, m = Math.min(w, h);
        if (!m) throw new Error('empty');
        x.fillStyle = '#fff'; x.fillRect(0, 0, S, S);
        x.drawImage(img, (w - m) / 2, (h - m) / 2, m, m, 0, 0, S, S);
        let q = 0.82, out = cv.toDataURL('image/jpeg', q);
        while (out.length > 30000 && q > 0.4) { q -= 0.12; out = cv.toDataURL('image/jpeg', q); }
        URL.revokeObjectURL(url); res(out);
      } catch (e) { URL.revokeObjectURL(url); rej(e); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('img')); };
    img.src = url;
  });
}

  P.coins -= price;
  if (kind === 'pot') { P.pot[k] = (P.pot[k] || 0) + 1; UI.toast(`${POTIONS[k].name} +1 (보유 ${P.pot[k]}개)`, 'good'); Store.save('priv'); }
  else if (kind === 'w') { P.wpn[k] = 0; P.eq.w = k; UI.toast(`${WEAPONS[k].name} 구매! 바로 장착했어요`, 'good'); Store.save('priv'); }
  else if (kind === 'a') { P.arm[k] = 0; P.eq.a = k; UI.toast(`${ARMORS[k].name} 구매! 바로 장착했어요`, 'good'); Store.save('priv'); }
  else { P.chars.push(k); P.ch = k; UI.toast(`${CHARS[k].name} 영입! 바로 선택했어요`, 'good'); Store.save('all'); }
  sfx('coin'); UI.renderShop(); UI.updateCoins();
}
function onChatSubmit(e) {
  e.preventDefault();
  const inp = $('#chatIn'), text = clean(inp.value.trim()).slice(0, 80);
  if (!text) return;
  const r = Store.sendChat(text);
  if (!r.ok) { UI.toast(r.msg, 'bad'); return; }
  inp.value = ''; sfx('click');
}
const ro = s => { const c = s.charCodeAt(s.length - 1); if (c < 0xAC00 || c > 0xD7A3) return s + '(으)로'; const j = (c - 0xAC00) % 28; return s + (j === 0 || j === 8 ? '로' : '으로'); };
function onCharsClick(e) {
  const b = e.target.closest('[data-cact]'); if (!b) return;
  const P = Store.P, k = b.dataset.k, act = b.dataset.cact, c = CHARS[k];
  if (!c) return;
  if (act === 'view') {
    if (UI.chView !== k) { UI.chView = k; UI.armed = null; }
    sfx('click'); UI.renderChars();
    const pb = $('#charsBody'); if (pb.scrollTop > 0) pb.scrollTo({ top: 0, behavior: reduceMotion ? 'auto' : 'smooth' });
    return;
  }
  if (act === 'pick') { if (!P.chars.includes(k)) return; P.ch = k; Store.save('all'); sfx('up'); UI.toast(`${ro(c.name)} 바꿨어요!`, 'good'); UI.renderChars(); return; }
  if (act === 'buy') {
    if (P.chars.includes(k)) return;
    if (P.coins < c.price) { UI.toast(`코인이 ${fmt(c.price - P.coins)} 부족해요`, 'bad'); sfx('fail'); return; }
    const key = 'c:' + k;
    if (UI.armed !== key) {
      UI.armed = key; clearTimeout(UI.armT);
      UI.armT = setTimeout(() => { UI.armed = null; if (UI.cur === 'chars') UI.renderChars(); }, 3000);
      sfx('click'); UI.renderChars(); return;
    }
    UI.armed = null; clearTimeout(UI.armT);
    P.coins -= c.price; P.chars.push(k); P.ch = k; Store.save('all');
    sfx('coin'); UI.toast(`${c.name} 영입! 바로 선택했어요`, 'good'); UI.updateCoins(); UI.renderChars();
  }
}
function startGame() {
  SFX.init(); sfx('click');
  UI.show('game');
  Game.start(loadoutFrom(Store.P), onGameEnd);
}
function onGameEnd(r) {
  const prevBest = Store.P.best;
  Store.applyResult(r);
  Game.stop();
  UI.showResult(r, r.score > prevBest && r.score > 0);
}
function enterLobby() { Store.startSubs(); Store.claim(); UI.show('lobby'); }

/* ================= 시작 ================= */
async function boot(hot) {
  hot = hot || {};
  prepFaces();
  Game.init(); UI.init();
  try { if (document.fonts) ['400 20px "Black Han Sans"', '400 20px "Lilita One"', '400 20px "Jua"'].forEach(f => document.fonts.load(f, '호준 브롤 123').catch(() => {})); } catch (e) { /* 글꼴 없어도 진행 */ }
  UI.show('title'); UI.setAuth('loading');
  await Store.init();
  const st = await Store.loadAccount();
  if (st === 'login' && hot.screen && hot.screen !== 'title') {
    enterLobby();
    if (hot.game && hot.game.v === 3) { UI.show('game'); Game.restore(hot.game, onGameEnd); }
    else if (['gear', 'shop', 'rank', 'chat'].includes(hot.screen)) UI.show(hot.screen);
    return;
  }
  UI.setAuth(st);
}
try {
  window.claude?.hot?.snapshot?.(() => ({ v: 1, screen: UI.cur, game: G && !G.over && UI.cur === 'game' ? JSON.parse(JSON.stringify(G)) : null }));
} catch (e) { /* 뷰어 밖 */ }
if (location.protocol === 'file:') {
  window.__HB = { get G() { return G; }, set G(v) { G = v; }, Store, UI, Game, IN, L, SCRIPT, step(n) { for (let i = 0; i < n && G && !G.ended; i++) update(STEP); }, render() { render(); }, onGameEnd, actPotion, tryAttack, fireUlt, autoUlt, autoTarget };
}
if (window.claude?.hot?.ready) window.claude.hot.ready(boot); else boot(window.claude?.hot?.data ?? {});

})();
</script>
